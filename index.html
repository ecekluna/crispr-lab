<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRISPRLAB STUDIO</title>
  
  <!-- Modern Fontlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #f9fafb;
      --border-light: #eaecf0;
      --text-main: #101828;
      --text-muted: #475467;
      --primary-crimson: #e11d48;
      --primary-crimson-hover: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* --- GÜNCELLENEN HEADER TASARIMI --- */
    .site-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      z-index: 100;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Logo & Rozet */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #09090b;
    }

    .brand-title span {
      color: var(--primary-crimson);
    }

    .brand-badge {
      background: #18181b;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    /* Navigasyon Linkleri */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      color: var(--text-main);
      background-color: #f1f5f9;
    }

    /* Vurgulu Buton (Genom Laboratuvarı) */
    .nav-btn-highlight {
      background: var(--primary-crimson);
      color: #ffffff !important;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.25);
      transition: all 0.2s ease;
    }

    .nav-btn-highlight:hover {
      background: var(--primary-crimson-hover) !important;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
      transform: translateY(-1px);
    }

    /* Kullanıcı Profili */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px 6px 6px;
      border-radius: 99px;
      border: 1px solid var(--border-light);
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .user-profile:hover {
      border-color: #d0d5dd;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* --- İÇERİK ALANI / ROZET --- */
    .main-wrapper {
      max-width: 1280px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .intro-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 99px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--primary-crimson);
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- YENİ MİNİMALİST VE PROFESYONEL HEADER -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- Sol: Logo & Rozet -->
      <a href="#" class="brand-logo">
        <span class="brand-title">CRISPR<span>LAB</span></span>
        <span class="brand-badge">STUDIO</span>
      </a>

      <!-- Orta: Navigasyon -->
      <nav class="nav-menu">
        <a href="#" class="nav-link">Biyoloji Rehberi</a>
        <a href="#" class="nav-link">Hikaye Modu</a>
        <a href="#" class="nav-link">Sıkça Sorulan Sorular</a>
        <a href="#" class="nav-link nav-btn-highlight">Genom Laboratuvarı</a>
      </nav>

      <!-- Sağ: Kullanıcı Profili -->
      <div class="user-profile">
        <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Ece Köseoğlu">
        <span class="user-name">Ece Köseoğlu</span>
      </div>

    </div>
  </header>

  <!-- ÖRNEK İÇERİK ALANI -->
  <main class="main-wrapper">
    <div class="intro-badge">
      <span class="status-dot"></span>
      <span>İnteraktif Genom Mühendisliği Platformu</span>
    </div>
  </main>

</body>
</html>
