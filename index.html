<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seni Seviyorum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent-red: #e11d48;
      --accent-hover: #be123c;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.07), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Arka Plan İnce Izgara Deseni */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.6;
      z-index: 0;
      pointer-events: none;
    }

    /* Üst Sayaç ve Skor Paneli */
    #ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: calc(100% - 40px);
      max-width: 420px;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      z-index: 10;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .stat-divider {
      width: 1px;
      height: 28px;
      background-color: var(--border-color);
    }

    /* Oyun Sahnesi */
    #game-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .heart-wrapper {
      position: absolute;
      cursor: pointer;
      animation: fall linear forwards;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    .heart-svg {
      width: 38px;
      height: 38px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 4px 10px rgba(225, 29, 72, 0.18));
    }

    .heart-wrapper:active .heart-svg {
      transform: scale(0.75);
    }

    @keyframes fall {
      0% {
        top: -60px;
        opacity: 0.9;
      }
      100% {
        top: 105vh;
        opacity: 1;
      }
    }

    /* Tıklama Pop Animasyonu */
    @keyframes popOut {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    .popping {
      animation: popOut 0.2s forwards !important;
      pointer-events: none;
    }

    /* Modal / Pop-up Tasarımı */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.2);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .modal {
      background: var(--card-bg);
      padding: 36px 32px;
      border-radius: 24px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      max-width: 380px;
      width: calc(100% - 40px);
      z-index: 100;
      transform: scale(1);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-icon {
      width: 52px;
      height: 52px;
      background: #ffe4e6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      color: var(--accent-red);
    }

    .modal h2 {
      color: var(--text-primary);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 500;
    }

    .highlight-score {
      font-weight: 800;
      color: var(--accent-red);
      font-size: 18px;
    }

    /* Buton Tasarımı */
    .btn {
      background: var(--text-primary);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: #1e293b;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Üst Panel -->
  <div id="ui">
    <div class="stat-box">
      <span class="stat-label">Puan</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-box">
      <span class="stat-label">Kalan Süre</span>
      <span class="stat-value"><span id="time">30</span>s</span>
    </div>
  </div>

  <!-- Oyun Alanı -->
  <div id="game-area"></div>

  <!-- Başlangıç Ekranı -->
  <div id="start-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <h2>Hazır mısın?</h2>
      <p>30 saniye boyunca ekrandan süzülen kalpleri toplayarak en yüksek puanı yap!</p>
      <button class="btn" onclick="startGame()">Oyunu Başlat</button>
    </div>
  </div>

  <!-- Bitiş Ekranı -->
  <div id="end-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <h2>Süre Bitti!</h2>
      <p>Topladığın Kalp: <span id="final-score" class="highlight-score">0</span><br><br><span id="custom-message">Ama merak etme, bendeki tüm kalpler zaten senin. İyi ki varsın!</span></p>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
    </div>
  </div>

  <script>
    let score = 0;
    let timeLeft = 30;
    let gameInterval;
    let timerInterval;
    const gameArea = document.getElementById('game-area');
    const scoreDisplay = document.getElementById('score');
    const timeDisplay = document.getElementById('time');
    const startModal = document.getElementById('start-modal');
    const endModal = document.getElementById('end-modal');
    const finalScoreDisplay = document.getElementById('final-score');

    // Renk Tonları
    const heartColors = ['#f43f5e', '#e11d48', '#fb7185', '#be123c', '#fda4af'];

    function getRandomHeartSvg() {
      const color = heartColors[Math.floor(Math.random() * heartColors.length)];
      return `<svg class="heart-svg" viewBox="0 0 24 24" fill="${color}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      scoreDisplay.innerText = score;
      timeDisplay.innerText = timeLeft;
      gameArea.innerHTML = '';

      startModal.classList.add('hidden');
      endModal.classList.add('hidden');

      gameInterval = setInterval(createHeart, 420);
      timerInterval = setInterval(updateTimer, 1000);
    }

    function createHeart() {
      const heartWrapper = document.createElement('div');
      heartWrapper.classList.add('heart-wrapper');
      heartWrapper.innerHTML = getRandomHeartSvg();
      
      const maxX = window.innerWidth - 60;
      heartWrapper.style.left = Math.max(10, Math.random() * maxX) + 'px';
      
      const duration = (Math.random() * 1.5 + 2).toFixed(1);
      heartWrapper.style.animationDuration = `${duration}s`;

      const collect = (e) => {
        e.stopPropagation();
        if (heartWrapper.classList.contains('popping')) return;

        score += 1;
        scoreDisplay.innerText = score;
        
        // Pop efekti ve kaldırma
        heartWrapper.classList.add('popping');
        setTimeout(() => heartWrapper.remove(), 200);
      };

      heartWrapper.addEventListener('mousedown', collect);
      heartWrapper.addEventListener('touchstart', collect, { passive: true });

      heartWrapper.addEventListener('animationend', () => heartWrapper.remove());
      gameArea.appendChild(heartWrapper);
    }

    function updateTimer() {
      timeLeft--;
      timeDisplay.innerText = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(gameInterval);
        clearInterval(timerInterval);
        gameArea.innerHTML = '';
        finalScoreDisplay.innerText = score;
        endModal.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
